name: AccessMap CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Backend Build, Validation, and Integration Tests
  # ===========================================================================
  backend-build-and-test:
    name: Backend Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Run Backend Tests
        run: ./mvnw -B clean verify

  # ===========================================================================
  # Frontend TypeScript Check & Vite Production Build
  # ===========================================================================
  frontend-build-and-check:
    name: Frontend Build (Node.js 20 / TypeScript / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Production Dist
        run: npm run build


# =============================================================================
# AccessMap Backend — Application Configuration
# =============================================================================
# IMPORTANT: Never commit a filled .env file to source control.
# Copy this file to .env and fill in real values for local development.
# Production values are always supplied via environment variables or secrets.
# =============================================================================

spring:
  application:
    name: accessmap-backend

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS DataSource
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:accessmap}}
    username: ${DB_USER:${POSTGRES_USER:accessmap_user}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:accessmap_dev_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: AccessMapHikariPool

  # ---------------------------------------------------------------------------
  # JPA / Hibernate Configuration
  # ---------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      # validate — Hibernate validates the schema matches entities but does NOT modify it.
      # Flyway owns all schema creation and migrations.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # ---------------------------------------------------------------------------
  # Flyway SQL Migration Runner
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ---------------------------------------------------------------------------
  # Multipart Upload — allow up to 15 MB per file (covers report evidence 10 MB
  # plus encoding overhead; avatar limit is enforced in service layer at 5 MB)
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 50MB
      file-size-threshold: 2MB

# ---------------------------------------------------------------------------
# Server Configuration
# ---------------------------------------------------------------------------
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ---------------------------------------------------------------------------
# Spring Security / JWT
# ---------------------------------------------------------------------------
accessmap:
  jwt:
    # In production, set JWT_SECRET to a minimum 256-bit random secret via environment variable.
    # Never hardcode a real secret here.
    secret: ${JWT_SECRET:ThisIsAPlaceholderSecretChangeItInProductionNow!!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}       # Default: 1 hour (short-lived access token)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # Default: 7 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  # Staleness threshold: Verifications older than this many days are flagged as UNVERIFIED_STALE
  verification:
    staleness-threshold-days: 180

  # ---------------------------------------------------------------------------
  # OpenStreetMap / Overpass API Integration
  # ---------------------------------------------------------------------------
  osm:
    # Overpass API endpoint. Can be replaced with a self-hosted or mirror instance.
    overpass-endpoint: ${OVERPASS_ENDPOINT:https://overpass-api.de/api/interpreter}
    # Set to false to disable all OSM provider calls (useful for CI or offline environments)
    enabled: ${OSM_ENABLED:true}
    timeout-seconds: ${OSM_TIMEOUT_SECONDS:15}
    rate-limit-ms: ${OSM_RATE_LIMIT_MS:1000}
    cache-ttl-minutes: ${OSM_CACHE_TTL_MINUTES:10}
    max-retries: ${OSM_MAX_RETRIES:2}

  # ---------------------------------------------------------------------------
  # Object Storage — MinIO (S3-compatible) or Local Storage
  # Set STORAGE_* environment variables to point to AWS S3 / GCS / R2 in production.
  # ---------------------------------------------------------------------------
  storage:
    provider: ${STORAGE_PROVIDER:auto}  # auto, local, s3, or minio
    local-dir: ${STORAGE_LOCAL_DIR:./storage/media}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:accessmap_minio}
    secret-key: ${STORAGE_SECRET_KEY:accessmap_minio_secret}
    bucket: ${STORAGE_BUCKET:accessmap-media}
    region: ${STORAGE_REGION:us-east-1}
    presigned-url-expiry-minutes: ${STORAGE_PRESIGNED_URL_EXPIRY_MINUTES:60}
    avatar:
      max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:5242880}      # 5 MB
    report-evidence:
      max-size-bytes: ${REPORT_EVIDENCE_MAX_SIZE_BYTES:10485760}  # 10 MB

  # ---------------------------------------------------------------------------
  # AI Provider & Assistant Configuration (Phase 14)
  # ---------------------------------------------------------------------------
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock} # 'mock' or 'openai-compatible'
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
    max-input-chars: ${AI_MAX_INPUT_CHARS:1000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:600}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}

# ---------------------------------------------------------------------------
# Actuator — Health Check Endpoint Only
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.accessmap: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# =============================================================================
# Development / Local in-memory Profile (activated with --spring.profiles.active=dev)
# Used when running locally without a Docker PostgreSQL container.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:accessmap_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
  flyway:
    enabled: false

accessmap:
  storage:
    provider: local
    local-dir: ./storage/media



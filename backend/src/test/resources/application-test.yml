spring:
  datasource:
    url: jdbc:h2:mem:accessmap_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
  flyway:
    enabled: false

accessmap:
  jwt:
    secret: ThisIsATestSecretKeyForUnitTestingAccessMapSpringSecurityMinimum256BitsLong!!
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000
  storage:
    provider: local
    local-dir: ./target/test-storage
  verification:
    staleness-threshold-days: 180


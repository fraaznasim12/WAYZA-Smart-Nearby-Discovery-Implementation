services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: accessmap-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-accessmap}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-accessmap_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-accessmap_dev_password}}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USER:-accessmap_user}} -d ${POSTGRES_DB:-${DB_NAME:-accessmap}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible local object storage for profile photos and report
  # evidence. Swap for AWS S3 / GCS / Cloudflare R2 in production by updating
  # the STORAGE_* environment variables in the backend service.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: accessmap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-accessmap_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-accessmap_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console (admin UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # MinIO bucket initialiser — runs once and exits.
  # Creates the 'accessmap-media' bucket with a private access policy.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T10-01-04Z
    container_name: accessmap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-accessmap_minio} ${MINIO_ROOT_PASSWORD:-accessmap_minio_secret};
        mc mb --ignore-existing local/accessmap-media;
        mc anonymous set none local/accessmap-media;
        echo 'MinIO bucket ready.';
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessmap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-accessmap}
      DB_USER: ${POSTGRES_USER:-accessmap_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-accessmap_dev_password}
      JWT_SECRET: ${JWT_SECRET:-ThisIsAPlaceholderSecretChangeItInProductionNow!!}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
      # Object Storage — MinIO (S3-compatible)
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-accessmap_minio}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-accessmap_minio_secret}
      STORAGE_BUCKET: accessmap-media
      STORAGE_REGION: us-east-1
      # Public URL base for constructing pre-signed URLs (adjust for production)
      STORAGE_PUBLIC_URL: http://localhost:9000
    ports:
      - "8080:8080"

volumes:
  postgis_data:
    driver: local
  minio_data:
    driver: local
